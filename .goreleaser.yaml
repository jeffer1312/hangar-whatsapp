version: 2
project_name: hangar-whatsapp

builds:
  - main: ./cmd/hangar-whatsapp
    binary: hangar-whatsapp
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  # C3: hangar-whatsapp_<X.Y.Z>_<os>_<arch>.<tar.gz|zip>, zip only on Windows.
  - name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md

checksum:
  name_template: checksums.txt
  algorithm: sha256

changelog:
  disable: true
